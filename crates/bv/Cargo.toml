[package]
name = "bv"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "bvr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["string"] }
bv-core = { path = "../bv-core" }
bv-analysis = { path = "../bv-analysis" }
bv-robot = { path = "../bv-robot" }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
bv-correlation = { path = "../bv-correlation" }
bv-graph-core = { path = "../bv-graph-core" }
bv-export = { path = "../bv-export" }
bv-tui = { path = "../bv-tui" }
bv-search = { path = "../bv-search" }
bv-update = { path = "../bv-update" }
# `--id-pattern` hands each value to regex::Regex::compile before registering
# it with bv-correlation (Go main.go:1772-1782), so the CLI needs the type.
regex = "1"
