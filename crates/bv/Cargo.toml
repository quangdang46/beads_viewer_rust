[package]
name = "bv"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "bvr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["string"] }
bv-core = { path = "../bv-core" }
bv-analysis = { path = "../bv-analysis" }
bv-robot = { path = "../bv-robot" }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
bv-correlation = { path = "../bv-correlation" }
bv-graph-core = { path = "../bv-graph-core" }
bv-export = { path = "../bv-export" }
bv-tui = { path = "../bv-tui" }
bv-search = { path = "../bv-search" }
bv-update = { path = "../bv-update" }
# `--id-pattern` hands each value to regex::Regex::compile before registering
# it with bv-correlation (Go main.go:1772-1782), so the CLI needs the type.
regex = "1"
# `--cpu-profile` (Go main.go:1908-1933) samples the process and writes the
# pprof protobuf, the same artifact Go's `runtime/pprof` produces. Rust has no
# stdlib equivalent, so the sampling comes from tikv/pprof-rs; `protobuf-codec`
# is the feature that turns its `Report` into a `protos::Profile` to encode.
# The protobuf-codegen half is a pure-Rust `.proto` parser, so this needs no
# `protoc` on the build machine (the prost-codec alternative would).
pprof = { version = "0.15.0", features = ["protobuf-codec"] }
# Go's `pprof.StartCPUProfile` gzips what it writes; pprof-rs hands back a bare
# `Profile` and leaves serialization to the caller, so the gzip wrapper is ours.
flate2 = "1"
# `--robot-history-timeout-ms` bounds the git-history prologue of robot triage
# with the same shape Go uses: the report is built on its own thread and the
# caller selects the result against a deadline. A channel plus `recv_timeout`
# is the sync stand-in for Go's `select` on `resCh` vs `histCtx.Done()`, and is
# this repo's established per-metric timeout pattern (no tokio, per AGENTS.md).
crossbeam-channel = { workspace = true }
# `--watch-export` (Go main.go:3315-3317) does `signal.Notify(sigCh,
# os.Interrupt, syscall.SIGTERM)` so Ctrl+C prints "Stopping watch mode..." and
# exits 0 instead of dying on the default disposition. Reproducing that needs a
# real signal handler, which std has no API for; libc is already in the lock
# file via other workspace members, so this adds no new package.
libc = "0.2"

[dev-dependencies]
# The watch-loop test has to deliver a real SIGINT to check the graceful
# shutdown path; `Child::kill` sends SIGKILL, which skips the handler entirely.
libc = "0.2"
