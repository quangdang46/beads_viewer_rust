[package]
name = "bv-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bv-core = { path = "../crates/bv-core" }
serde_json = "1"

[[bin]]
name = "fuzz_parse_jsonl"
path = "fuzz_targets/fuzz_parse_jsonl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dependency_deser"
path = "fuzz_targets/fuzz_dependency_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_redirect"
path = "fuzz_targets/fuzz_redirect.rs"
test = false
doc = false
bench = false
