name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Placeholder differential gate: goldens are frozen; the Rust side gains
  # real comparison logic with Phase 1 acceptance work. This job fails loudly
  # if the golden corpus goes missing.
  differential:
    name: Golden corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify golden corpus present and non-empty
        run: |
          count=$(find golden -type f | wc -l)
          echo "golden files: $count"
          [ "$count" -ge 70 ] || { echo "::error::Golden corpus missing/thin ($count < 70)"; exit 1; }
          grep -q "go_commit: 9ace029" golden/METADATA.txt
