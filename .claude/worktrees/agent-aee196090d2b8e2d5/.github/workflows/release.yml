name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  BIN_NAME: bvr
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            method: cross
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            method: cross
            suffix: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            method: native
            suffix: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            method: native
            suffix: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            method: native
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.method == 'cross'
        run: cargo install cross --locked
      # Placeholder until crates/bv exists (Phase 0 scaffolding).
      # When the binary crate lands, this builds it for real.
      - name: Build
        run: |
          if [ -f "crates/bv/Cargo.toml" ]; then
            if [ "${{ matrix.method }}" = "cross" ]; then
              cross build --release --target ${{ matrix.target }} -p bv
            else
              cargo build --release --target ${{ matrix.target }} -p bv
            fi
          else
            echo "::warning::crates/bv not yet scaffolded — producing empty artifact"
            mkdir -p staging
            echo "bvr placeholder — binary crate arrives with Phase 0" > staging/README.txt
          fi
        shell: bash
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="${BIN_NAME}-${VERSION}-${{ matrix.suffix }}.tar.gz"
          mkdir -p staging
          if [ -f "target/${{ matrix.target }}/release/${BIN_NAME}" ]; then
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" staging/
          fi
          tar -czf "$ARCHIVE" -C staging .
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
        shell: bash
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $archive = "$($env:BIN_NAME)-$version-$($env:RUNNER_TARGET).zip"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          $bin = "target/${{ matrix.target }}/release/$($env:BIN_NAME).exe"
          if (Test-Path $bin) { Copy-Item $bin staging/ }
          Compress-Archive -Path staging/* -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii
          "ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Append
        env:
          RUNNER_TARGET: ${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            *.tar.gz
            *.zip
            *.sha256

  release:
    name: Attach artifacts to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
