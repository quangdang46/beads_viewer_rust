name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Differential gate vs the Go oracle runs on a separate job so local-style
  # failures (fmt/clippy) don't mask parity regressions.
  differential:
    name: Differential vs Go oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # Golden fixtures are frozen; this job only verifies the Rust side still
      # reproduces them. Full live-differential (build Go bv + compare) lands
      # with bead p1-model-loader acceptance work.
      - run: |
          if [ -d golden ]; then
            echo "Golden suite present — wiring live differential in Phase 1"
          else
            echo "No golden/ yet (Phase 0 pending) — placeholder pass"
          fi
